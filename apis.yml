name: Grove Biopharma
description: >-
  Grove Biopharma is a Chicago-based biopharmaceutical company developing
  therapeutics that target intracellular protein-protein interactions implicated
  in cancer, neurodegenerative diseases, and rare disorders. The company
  pioneered Bionic Biologics, hybrid biomolecules that integrate principles of
  biologic and synthetic design to achieve cell permeability with customizable,
  modular construction that can disrupt or degrade disease-causing proteins.
  Grove has demonstrated proof-of-concept against targets including AR/AR-V7,
  SHOC2, MYC, TAU, and KEAP1/NRF2. Founded in 2025 and led by CEO Geoffrey Duyk,
  the company raised a $30M Series A in April 2025 and is backed by DCVC. Grove
  is a therapeutics company with no public developer API surface; this profile
  captures its identity for the API Evangelist network.
